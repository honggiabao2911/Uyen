<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Phương Uyên 🐤💛</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Quicksand', sans-serif; touch-action: none; background-color: #ffb300; }
        
        #main-gradient-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(135deg, #ffe082, #ff8f00, #ffca28, #ff6f00); background-size: 300% 300%; animation: gradientBG 8s ease infinite; z-index: 0; transition: opacity 1.5s ease; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: all 0.5s; display: none !important; }

        #flash-bang { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 2s ease-out; }
        .flash-active { animation: flashAnim 2.5s forwards; }
        @keyframes flashAnim { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }

        #slash-effect { position: fixed; height: 4px; background: white; box-shadow: 0 0 15px 5px #fff, 0 0 30px 10px #ffeb3b; border-radius: 50%; pointer-events: none; z-index: 9999; opacity: 0; transform-origin: left center; }

        #bg-decor-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; overflow: hidden; pointer-events: none; }
        .bg-icon { position: absolute; bottom: -50px; animation: floatUp linear infinite; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); opacity: 0; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; } 10% { opacity: 0.85; } 90% { opacity: 0.85; } 100% { transform: translateY(-120vh) rotate(360deg) scale(1.2); opacity: 0; } }

        /* UI CHUNG */
        .step-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; transition: opacity 0.8s ease-in-out; }
        .glass-box { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); padding: 40px 30px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); text-align: center; }
        
        #play-music-btn { position: absolute; top: 20px; right: 20px; z-index: 50; background: rgba(255,255,255,0.9); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s; animation: floatMusic 2s infinite ease-in-out; }
        @keyframes floatMusic { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* BƯỚC 0: CHỌN NGÔN NGỮ */
        .btn-lang { background: linear-gradient(45deg, #ff6f00, #ff9800); color: white; border: none; padding: 12px 22px; font-size: 16px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 111, 0, 0.4); transition: 0.2s; font-family: 'Quicksand', sans-serif; margin: 5px; }
        .btn-lang:active { transform: scale(0.9); }
        .lang-title { color: #d84315; font-size: 26px; font-weight: bold; margin-bottom: 25px; text-shadow: 1px 1px 2px rgba(255,255,255,0.5); }

        /* BƯỚC 0.5: INTRO CANVAS TRÁI TIM */
        #intro-canvas-screen { z-index: 105; background: linear-gradient(135deg, #ffebee 0%, #f8bbd0 100%); cursor: pointer; }
        #heartCanvas { display: block; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        .tap-hint-canvas { position: absolute; bottom: 40px; font-weight: bold; color: #fff; font-size: 18px; opacity: 0; background: linear-gradient(45deg, #e91e63, #ff4081); padding: 12px 30px; border-radius: 30px; box-shadow: 0 4px 20px rgba(233, 30, 99, 0.4); animation: fadeInHint 1s forwards 3s, pulseHint 1.5s infinite 3s; z-index: 106; pointer-events: none; border: 2px solid rgba(255,255,255,0.5); }

        /* BƯỚC 1: BÁNH KEM */
        #step1-cake { cursor: crosshair; }
        .cake-container-split { position: relative; width: 220px; height: 180px; display: flex; justify-content: center; align-items: flex-end; }
        .cake-half { position: absolute; bottom: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; transition: transform 0.8s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.8s; }
        
        .half-left { clip-path: polygon(-50% -50%, 50% -50%, 50% 150%, -50% 150%); }
        .half-right { clip-path: polygon(50% -50%, 150% -50%, 150% 150%, 50% 150%); }
        
        .cake-layer { border-radius: 12px; margin: 2px auto; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .layer1 { width: 190px; height: 55px; background: linear-gradient(to bottom, #5d4037, #3e2723); }
        .layer2 { width: 150px; height: 50px; background: linear-gradient(to bottom, #f48fb1, #d81b60); }
        .layer3 { width: 110px; height: 45px; background: linear-gradient(to bottom, #fff, #fce4ec); }
        
        .candle-2d { width: 14px; height: 45px; background: repeating-linear-gradient(45deg, white, white 5px, #ff5252 5px, #ff5252 10px); margin: 0 auto; border-radius: 4px; position: relative; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); z-index: 5;}
        
        .flame-wrapper { position: absolute; top: -35px; left: -3px; opacity: 0; }
        .falling .flame-wrapper { animation: fadeInFlame 0.5s forwards 1.5s; }
        .flame-2d { width: 20px; height: 32px; background: radial-gradient(ellipse at center, #fff 0%, #ffeb3b 40%, #ff9800 100%); border-radius: 50% 50% 20% 20%; filter: drop-shadow(0 0 15px #ff9800); animation: flicker 0.15s infinite alternate; }

        .falling { animation: dropDown 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes dropDown { 0% { transform: translateY(-100vh); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInFlame { to { opacity: 1; } }
        @keyframes flicker { 0% { transform: scale(1) rotate(-3deg); filter: drop-shadow(0 0 15px #ffeb3b); } 100% { transform: scale(1.1) rotate(3deg); filter: drop-shadow(0 0 25px #ff9800); } }
        
        .sliced .half-left { transform: translate(-80px, 60px) rotate(-25deg); opacity: 0; filter: blur(5px); }
        .sliced .half-right { transform: translate(80px, 60px) rotate(25deg); opacity: 0; filter: blur(5px); }

        .click-hint { margin-top: 50px; font-weight: bold; color: #fff; font-size: 16px; text-align: center; opacity: 0; background: linear-gradient(45deg, #d84315, #ff5722); padding: 12px 25px; border-radius: 30px; box-shadow: 0 5px 20px rgba(216, 67, 21, 0.4); border: 2px solid rgba(255,255,255,0.5); }
        .falling ~ .click-hint { animation: fadeInHint 1s forwards 2.5s, pulseHint 1s infinite 2.5s; }

        @keyframes pulseHint { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes fadeInHint { to { opacity: 1; } }

        /* BƯỚC 2: SỔ ẢNH */
        #step2-book { perspective: 1800px; }
        .step-title { font-family: 'Dancing Script', cursive; font-size: 45px; color: #fff; margin-bottom: 30px; text-align: center; text-shadow: 3px 3px 10px rgba(216, 67, 21, 0.9); animation: floatTitle 3s infinite ease-in-out; }
        @keyframes floatTitle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .book { width: 90vw; max-width: 320px; height: 240px; position: relative; transform-style: preserve-3d; cursor: pointer; filter: drop-shadow(0 25px 35px rgba(0,0,0,0.4)); }
        .page { width: 50%; height: 100%; position: absolute; right: 0; top: 0; transform-origin: left center; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1); background: #fff; border: 3px solid #ffd54f; border-radius: 0 12px 12px 0; box-shadow: inset 4px 0 10px rgba(0,0,0,0.05), 4px 4px 15px rgba(0,0,0,0.2); }
        .page-front, .page-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 8px; background: #fff; border-radius: 0 10px 10px 0; }
        .page-back { transform: rotateY(180deg); background: #fffde7; border-radius: 10px 0 0 10px;}
        .page img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        .page.flipped { transform: rotateY(-180deg); }
        
        #page1 .page-front { background: linear-gradient(135deg, #ff9800, #e65100); border: none; }
        .page-title { font-family: 'Dancing Script', cursive; font-size: 36px; color: #fff; text-align: center; line-height: 1.3; text-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .swipe-hint { position: absolute; bottom: -50px; width: 100%; text-align: center; color: #fff; font-weight: bold; font-size: 15px; text-shadow: 1px 1px 5px rgba(216, 67, 21, 0.9); letter-spacing: 1px; }
        .caption { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); padding: 6px 18px; border-radius: 25px; font-weight: bold; color: #d84315; font-size: 13px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); pointer-events: none; white-space: nowrap; border: 1px solid #ffd54f; }

        /* BƯỚC 3: THƯ */
        .envelope { width: 90vw; max-width: 360px; height: 240px; background: linear-gradient(to bottom, #ff9800, #f57c00); position: relative; cursor: pointer; border-radius: 12px; box-shadow: 0 25px 45px rgba(0,0,0,0.4); transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(255,255,255,0.2); }
        .envelope:hover { transform: translateY(-5px); }
        .envelope::before { content: ''; position: absolute; top: 0; left: 0; right: 0; border-top: 120px solid #ffb74d; border-left: 180px solid transparent; border-right: 180px solid transparent; z-index: 3; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: top; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.15)); }
        
        .envelope.open { transform: translateY(80px) scale(0.9); }
        .envelope.open::before { transform: rotateX(180deg); z-index: 1; }
        
        .letter-paper { position: absolute; bottom: 10px; left: 10px; right: 10px; height: 210px; background: #fffaf0; padding: 25px 20px; border-radius: 8px; z-index: 2; transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1), height 1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s; opacity: 0; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.1); border: 1px solid #ffe082; overflow: hidden; }
        
        .envelope.open .letter-paper { transform: translateY(-130px); height: 360px; opacity: 1; z-index: 4; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        
        .letter-content { overflow-y: auto; flex-grow: 1; margin-bottom: 15px; padding-right: 5px; text-align: left; scroll-behavior: smooth; }
        .letter-content::-webkit-scrollbar { width: 5px; }
        .letter-content::-webkit-scrollbar-thumb { background: #ffcc80; border-radius: 5px; }
        
        .letter-paper h3 { font-family: 'Dancing Script', cursive; color: #d84315; font-size: 32px; margin-bottom: 15px; border-bottom: 2px dashed #ffcc80; padding-bottom: 8px; text-align: center; min-height: 40px; }
        .letter-paper p { font-size: 15px; line-height: 1.6; color: #444; margin-bottom: 12px; text-align: justify; min-height: 25px; }
        
        .typing-cursor::after { content: '|'; animation: blink 1s step-end infinite; color: #d84315; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .env-hint { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(255,255,255,0.9); padding: 8px 20px; border-radius: 20px; 
            color: #d84315; font-weight: bold; z-index: 5; pointer-events: none; 
            white-space: nowrap; box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            animation: pulseEnvHint 1.5s infinite; 
        }
        @keyframes pulseEnvHint { 
            0% { transform: translate(-50%, -50%) scale(1); } 
            50% { transform: translate(-50%, -50%) scale(1.08); } 
            100% { transform: translate(-50%, -50%) scale(1); } 
        }
        
        .envelope.open .env-hint { display: none; }

        .btn-next-3d { padding: 15px; font-size: 16px; border-radius: 30px; width: 100%; box-shadow: 0 8px 25px rgba(255, 111, 0, 0.4); background: linear-gradient(45deg, #ff6f00, #ff9800); color: white; border: none; font-weight: bold; cursor: pointer; transition: transform 0.2s, opacity 1s; opacity: 0; pointer-events: none; }
        .btn-next-3d:active { transform: scale(0.95); }

        /* BƯỚC 4: 3D KHÔNG GIAN VŨ TRỤ */
        #phase2 { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; opacity: 0; pointer-events: none; z-index: 5; transition: opacity 1.5s; background: radial-gradient(circle at center, rgba(10, 15, 30, 0.8), rgba(0, 0, 0, 1)), url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat; background-attachment: fixed; }
        .text-label { color: #fff; font-size: 16px; font-weight: bold; pointer-events: none; background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05)); backdrop-filter: blur(8px); padding: 12px 25px; border-radius: 30px; border: 1px solid rgba(255, 213, 79, 0.8); white-space: nowrap; box-shadow: 0 0 20px rgba(255, 213, 79, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.2); text-shadow: 0 0 8px #ffca28; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div id="main-gradient-bg"></div>
    <div id="flash-bang"></div>
    <div id="slash-effect"></div>

    <audio id="drop-sound" src="rotbanh.mp3"></audio>
    <audio id="bg-music" loop><source src="nhac-sinh-nhat.mp3" type="audio/mpeg"></audio>
    <button id="play-music-btn">🎵</button>

    <div id="bg-decor-container"></div>

    <!-- MÀN HÌNH CHỌN NGÔN NGỮ -->
    <div id="screen-lang" class="step-container">
        <div class="glass-box" style="padding: 30px 20px;">
            <div class="lang-title">Language / Ngôn ngữ / 语言</div>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                <button class="btn-lang" onclick="selectLang('vi')">🇻🇳 Tiếng Việt</button>
                <button class="btn-lang" onclick="selectLang('zh')">🇨🇳 中文</button>
                <button class="btn-lang" onclick="selectLang('en')">🇬🇧 English</button>
            </div>
        </div>
    </div>

    <!-- INTRO CANVAS -->
    <div id="intro-canvas-screen" class="step-container hidden">
        <canvas id="heartCanvas"></canvas>
        <div class="tap-hint-canvas" id="t-tap-hint">👉 Chạm vào màn hình 👈</div>
    </div>

    <!-- MÀN HÌNH BÁNH KEM -->
    <div id="step1-cake" class="step-container hidden">
        <div class="cake-container-split" id="cake-wrapper">
            <div class="cake-half half-left">
                <div class="candle-2d"><div class="flame-wrapper"><div class="flame-2d"></div></div></div>
                <div class="cake-layer layer3"></div><div class="cake-layer layer2"></div><div class="cake-layer layer1"></div>
            </div>
            <div class="cake-half half-right">
                <div class="candle-2d"><div class="flame-wrapper"><div class="flame-2d"></div></div></div>
                <div class="cake-layer layer3"></div><div class="cake-layer layer2"></div><div class="cake-layer layer1"></div>
            </div>
        </div>
        <p class="click-hint" id="t-cake-hint">👉 Vuốt (Chém) bánh kem để chia phần nha 👈</p>
    </div>

    <!-- SỔ ẢNH -->
    <div id="step2-book" class="step-container hidden">
        <div class="step-title" id="t-album-title">Album "dìm hàng" 🐥</div>
        <div class="book" id="the-book">
            <div class="page" id="page6" style="z-index: 1;"><div class="page-front"><img src="anh10.jpg" alt="Ảnh"><div class="caption">🤪</div></div><div class="page-back"><img src="anh11.jpg" alt="Ảnh"><div class="caption">✨</div></div></div>
            <div class="page" id="page5" style="z-index: 2;"><div class="page-front"><img src="anh8.jpg" alt="Ảnh"><div class="caption">😎</div></div><div class="page-back"><img src="anh9.jpg" alt="Ảnh"><div class="caption">💛</div></div></div>
            <div class="page" id="page4" style="z-index: 3;"><div class="page-front"><img src="anh6.jpg" alt="Ảnh"><div class="caption">😍</div></div><div class="page-back"><img src="anh7.jpg" alt="Ảnh"><div class="caption">🐥</div></div></div>
            <div class="page" id="page3" style="z-index: 4;"><div class="page-front"><img src="anh4.jpg" alt="Ảnh"><div class="caption">🍼</div></div><div class="page-back"><img src="anh5.jpg" alt="Ảnh"><div class="caption">📸</div></div></div>
            <div class="page" id="page2" style="z-index: 5;"><div class="page-front"><img src="anh2.jpg" alt="Ảnh"><div class="caption">💯</div></div><div class="page-back"><img src="anh3.jpg" alt="Ảnh"><div class="caption">💃</div></div></div>
            <div class="page" id="page1" style="z-index: 6;">
                <div class="page-front"><div class="page-title" id="t-book-cover">Sổ Ảnh<br>Kỷ Niệm<br>🤫</div></div>
                <div class="page-back"><img src="anh1.jpg" alt="Ảnh"><div class="caption">🎉</div></div>
            </div>
            <div class="swipe-hint" id="t-book-hint">Vuốt ngang (👈) hoặc Chạm để lật trang</div>
        </div>
    </div>

    <!-- BỨC THƯ GÕ MÁY CHỮ TỰ ĐỘNG -->
    <div id="step3-letter" class="step-container hidden">
        <div class="envelope" id="envelope">
            <div class="env-hint" id="t-env-hint">👉 Chạm để mở thư 👈</div>
            <div class="letter-paper">
                <div class="letter-content">
                    <h3 id="t-letter-h3"></h3>
                    <p id="t-letter-p1"></p>
                    <p id="t-letter-p2"></p>
                    <p id="t-letter-p3"></p>
                    <p style="font-family: 'Dancing Script', cursive; font-size: 28px; color: #d84315; text-align: center; margin-top: 15px;" id="t-letter-sign"></p>
                </div>
                <button class="btn-next-3d" id="btn-to-3d"><span id="t-btn-3d">Kích hoạt không gian 3D 🚀</span></button>
            </div>
        </div>
    </div>

    <div id="phase2"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // NỀN BONG BÓNG NHỘN NHỊP
        const bgContainer = document.getElementById('bg-decor-container');
        const icons = ['🐤', '✨', '💛', '🦆', '🎂', '🎉', '🌟', '💖', '🎈'];
        for(let i=0; i<60; i++) {
            let el = document.createElement('div'); el.className = 'bg-icon';
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            el.style.fontSize = (Math.random() * 20 + 15) + 'px'; el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 10 + 5) + 's'; el.style.animationDelay = (Math.random() * 5) + 's';
            bgContainer.appendChild(el);
        }

        // TỪ ĐIỂN MỚI TOANH DÀNH CHO CÔ BẠN NGOẠI NGỮ
        const dict = {
            vi: {
                introText: "Happy Birthday", tapHint: "👉 Chạm vào màn hình 👈", cakeHint: "👉 Vuốt (Chém) bánh kem để chia phần nha 👈",
                albumTitle: "Album 'dìm hàng' 🐥", bookCover: "Sổ Ảnh<br>Kỷ Niệm<br>🤫", bookHint: "Vuốt ngang (👈) hoặc Chạm để lật trang", envHint: "👉 Chạm để mở thư 👈",
                lH3: "Chúc mừng sinh nhật Uyên 🥳🎂",

            });

            const starCount = isMobile ? 800 : 1500; const posArray = new Float32Array(starCount * 3); for(let i = 0; i < starCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 150;
            const starsGeo = new THREE.BufferGeometry(); starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starParticles = new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.25, color: 0xffca28, transparent: true, opacity: 0.7 })); scene.add(starParticles);

            const fireflyCount = isMobile ? 100 : 150; const fireflyArray = new Float32Array(fireflyCount * 3); for(let i = 0; i < fireflyCount * 3; i++) fireflyArray[i] = (Math.random() - 0.5) * 20;
            const fireflyGeo = new THREE.BufferGeometry(); fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyArray, 3));
            const fireflies = new THREE.Points(fireflyGeo, new THREE.PointsMaterial({ size: 0.6, color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending })); scene.add(fireflies);

            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.position.z = window.innerWidth < 768 ? 65 : 55; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight); });

            const clock = new THREE.Clock(); let introLerp = 0;
            function animate() {
                requestAnimationFrame(animate); const delta = clock.getDelta(); const elapsedTime = clock.getElapsedTime();
                if (introLerp < 1) { introLerp += delta * 0.4; if (introLerp > 1) introLerp = 1; camera.position.lerpVectors(startCamPos, endCamPos, easeOutCubic(introLerp)); } controls.update();
                const expansion = easeOutCubic(introLerp);
                flameMesh.scale.set(1 + Math.sin(elapsedTime*10)*0.15, 1 + Math.cos(elapsedTime*15)*0.2, 1 + Math.sin(elapsedTime*10)*0.15); cakeGroup.rotation.y -= delta * 0.3; cakeGroup.position.y = Math.sin(elapsedTime * 2) * 0.6; 
                photoCubesGroup.rotation.y += delta * 0.15; photoCubesGroup.children.forEach(c => { c.position.x = Math.cos(c.userData.angle) * (c.userData.radius * expansion); c.position.z = Math.sin(c.userData.angle) * (c.userData.radius * expansion); c.position.y = (c.userData.baseY * expansion) + Math.sin(elapsedTime * c.userData.bobSpeed) * 3; c.rotation.x += c.userData.rx * delta; c.rotation.y += c.userData.ry * delta; });
                textGroup.rotation.y -= delta * 0.15; textGroup.children.forEach(lbl => { lbl.position.x = Math.cos(lbl.userData.angle) * (lbl.userData.radius * expansion); lbl.position.z = Math.sin(lbl.userData.angle) * (lbl.userData.radius * expansion); lbl.position.y = (lbl.userData.baseY * expansion) + Math.sin(elapsedTime * 1.5 + lbl.userData.timeOffset) * 2; });
                fireflies.rotation.y += delta * 0.5; fireflies.rotation.x = Math.sin(elapsedTime * 0.5) * 0.2; fireflies.position.y = Math.sin(elapsedTime) * 1.5; starParticles.rotation.y += delta * 0.05; 
                renderer.render(scene, camera); labelRenderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
